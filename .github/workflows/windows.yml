name: Build Windows portable
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -X utf8 tools/build-manual.py
      - run: npm run package:portable
      - run: python -X utf8 tools/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: LevelDiagramStudio-Windows-x64
          path: release/*
          if-no-files-found: error
