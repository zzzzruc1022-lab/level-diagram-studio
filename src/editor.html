<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src &#39;none&#39;; script-src &#39;unsafe-inline&#39;; style-src &#39;unsafe-inline&#39;; img-src data: blob:; connect-src &#39;none&#39;; base-uri &#39;none&#39;; form-action &#39;none&#39;"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关卡简图工坊 v1.0</title><style>/*EDITOR_CSS*/</style></head><body>
<header><div class="brand"><span class="brand-icon">▱</span><div><b>关卡简图工坊</b><small>LEVEL DIAGRAM STUDIO · 1.0</small></div></div><button class="primary" data-action="new">＋ 新建图稿</button><div class="header-divider"></div><div class="history"><button data-action="undo" aria-label="撤销" title="Ctrl+Z 撤销上一步">↶</button><button data-action="redo" aria-label="重做" title="Ctrl+Shift+Z">↷</button></div><div class="header-title"><span id="doc-title">空间与体验，都能看见。</span><small id="doc-kind">空间图 · 曲线图</small></div><div class="actions"><button data-action="help">使用说明</button><button data-action="import">打开工程</button><button data-action="project">下载工程</button><button data-action="export-menu" class="primary-soft">导出图稿 ▾</button></div></header>
<div class="workspace"><aside class="left"><div class="section-heading"><h2>图稿</h2><span id="document-count" class="badge">0</span></div><select id="document-select" aria-label="当前图稿"></select><div class="sub-actions"><button data-action="duplicate-document">复制图稿</button><button data-action="delete-document" class="danger">删除图稿</button></div>
<div id="floor-panel" hidden><div class="section-heading"><h2>楼层 · 点击全选</h2><button data-action="add-floor" title="新增楼层">＋</button></div><div id="floors"></div><label class="check"><input id="ghost" type="checkbox" checked>显示其他楼层参考</label></div>
<div class="section-heading"><h2>绘图工具</h2><span class="muted">快捷键</span></div><div class="tool-grid" role="toolbar" aria-label="绘图工具">
<button data-tool="select"><span>↖</span>选择<kbd>Q</kbd></button><button data-tool="move"><span>✥</span>移动组件<kbd>W</kbd></button><button data-tool="size"><span>⤢</span>大小<kbd>S</kbd></button><button data-tool="rotate"><span>↻</span>旋转<kbd>E</kbd></button><button data-tool="vertex"><span>◇</span>顶点<kbd>V</kbd></button><button data-tool="plane"><span>▱</span>平面<kbd>P</kbd></button><button data-tool="wall"><span>▥</span>墙壁</button><button data-tool="hole"><span>◌</span>空洞<kbd>O</kbd></button><button data-tool="stairs"><span>▟</span>楼梯</button><button data-tool="ladder"><span>☷</span>爬梯</button><button data-tool="spiral"><span>◎</span>旋转楼梯</button><button data-tool="route"><span>↗</span>路线<kbd>R</kbd></button><button data-tool="text"><span>T</span>文字<kbd>T</kbd></button><button data-tool="marker"><span>⊙</span>标记<kbd>M</kbd></button><button data-tool="pan"><span>✥</span>平移视图<kbd>H</kbd></button></div>
<div class="section-heading"><h2>组件 · 单件编辑</h2><select id="layer-filter" aria-label="筛选组件"><option value="all">全部</option><option value="plane">平面</option><option value="wall">墙壁</option><option value="hole">空洞</option><option value="stairs">楼梯</option><option value="text">文字</option><option value="route">路线</option></select></div><div id="layers"></div><div class="selection-actions"><button data-action="copy">复制</button><button data-action="paste">粘贴</button><button data-action="group">编组</button><button data-action="ungroup">解组</button></div><p class="shortcut-note">绘图工具快捷键请切换英文输入法。</p><div class="mini-help">Alt＋左键拖动复制 · Ctrl 点击多选<br>中键 / 空格平移 · Ctrl+Z 撤销</div></aside>
<main><div class="canvas-top"><div class="segmented"><button data-view="plan">平面图</button><button data-view="elevation">立面图</button><button data-view="solid">立体图</button></div><div class="canvas-options"><label class="check" title="移动、旋转和大小拖拽时吸附组件边，Ctrl 暂停"><input id="move-snap" type="checkbox" checked>组件吸附</label><label class="check"><input id="geometry-snap" type="checkbox" checked>顶点对齐</label><label class="check"><input id="rotation-snap" type="checkbox" checked>90° 吸附</label><label class="check"><input id="snap" type="checkbox">网格吸附</label><label class="check"><input id="show-grid" type="checkbox">网格</label><div id="backgrounds"></div><button data-action="fit-selected">适应所选</button><button data-action="fit">适应画布</button></div></div><div id="elevation-tabs" hidden><button data-side="front">正立面</button><button data-side="left">左立面</button><button data-side="right">右立面</button><select id="elevation-scope" aria-label="立面显示范围"><option value="all">整个空间</option><option value="floor">当前楼层</option><option value="selection">仅所选组件</option></select><span id="face-label"></span><button data-action="exit-face" hidden>返回原视图</button></div>
<div id="space-options" class="canvas-options"><label class="check"><input id="height-refs" type="checkbox" checked>高度参考线</label><label class="check"><input id="stair-arrows" type="checkbox" checked>楼梯方向箭头</label></div><div id="creation-options" hidden><label>创建形状<select id="creation-shape"></select></label><span>右键退出创建 · 已放置组件保留</span></div><div id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="可编辑图稿" role="img"><g id="scene"></g><g id="handles"></g></svg><div id="welcome"><div class="template-cards"><button data-template="space"><span class="template-icon">▱</span><b>空间图</b><small>平面 · 墙壁与楼梯 · 三视图编辑</small><em>创建空间图 →</em></button><button data-template="curve"><span class="template-icon">⌁</span><b>曲线图</b><small>自定义坐标轴 · 阶段 · 事件节点</small><em>创建曲线图 →</em></button></div><small class="welcome-foot">离线可用 · JSON 工程可迁移 · 自动暂存</small></div>
<div id="drawing-hint" hidden><span id="drawing-label"></span><button data-action="finish" class="primary">完成绘制</button><button data-action="cancel">取消</button></div><div id="view-controls" hidden><label>方位<input id="azimuth" type="range" min="0" max="360" value="35"></label><label>俯仰<input id="elevation" type="range" min="0.5" max="90" step="0.5" title="俯仰角范围：0.5°–90°" value="35"></label><button data-action="observe-front">正面</button><button data-action="observe-left">左侧</button><button data-action="observe-right">右侧</button><button data-action="edit-elevation">立面编辑所选</button><button data-action="reset-view">重置</button><label class="check"><input id="reverse-horizontal" type="checkbox">反转水平拖动</label><label class="check"><input id="reverse-vertical" type="checkbox">反转垂直拖动</label></div><div id="inline-edit-shell" hidden><div id="inline-editor" contenteditable="true" role="textbox" aria-label="直接编辑文字" spellcheck="false" hidden></div><label class="inline-size-control" title="调整当前文字字号；跟随分组的文字会同步调整同组字号"><span>字号</span><input id="inline-font-size" type="number" min="8" max="200" step="1" aria-label="编辑文字字号"></label></div></div>
<div class="canvas-bottom"><span id="selection-info">新建图稿开始编辑</span><div class="zoom"><button data-action="zoom-out" aria-label="缩小">−</button><span id="zoom-label">100%</span><button data-action="zoom-in" aria-label="放大">＋</button></div></div><footer><span class="status-dot"></span><span id="status" role="status">准备就绪</span><a id="last-download" hidden>再次下载</a><span id="stats"></span></footer></main>
<aside class="right"><div class="panel-tabs"><button data-panel="properties">属性</button><button data-panel="document">图稿设置</button></div><div id="properties"></div><div id="document-properties" hidden></div></aside></div>
<div id="context-menu" role="menu" class="popover menu" hidden></div><div id="export-popover" class="popover menu" hidden><button data-action="svg">导出 SVG<span>几何为矢量 · 自动对比文字含图像遮罩</span></button><button data-action="png">导出 PNG<span>2× 清晰度 · 当前视图与背景</span></button></div>
<dialog id="new-dialog"><div class="dialog-heading"><h2>新建图稿</h2><button data-action="close-new" aria-label="关闭">×</button></div><label class="field">图稿名称<input id="new-name" maxlength="100" placeholder="未命名图稿"></label><div class="new-types"><button data-template="space"><span>▱</span><b>空间图</b><small>一个平面与可编辑文字</small></button><button data-template="curve"><span>⌁</span><b>曲线图</b><small>三个阶段与三个事件</small></button></div></dialog>
<dialog id="help-dialog" aria-labelledby="help-title"><div class="dialog-heading"><h2 id="help-title">使用说明</h2><button data-action="close-help" aria-label="关闭使用说明">×</button></div><!--HELP_CONTENT--></dialog><dialog id="export-dialog"><div class="dialog-heading"><h2>导出图稿 · 预览</h2><button data-action="export-close" aria-label="关闭导出预览">×</button></div><div class="export-layout"><section class="export-visual"><div class="preview-bar"><button data-action="preview-fit">适应全图</button><button data-action="preview-100">100%</button><span id="export-zoom">100%</span><small>滚轮缩放 · 拖动查看</small></div><div id="export-preview-content"></div></section><aside class="export-settings"><label class="field">文件名<input id="export-name"></label><label class="field">文件格式<select id="export-format"><option value="png">PNG</option><option value="svg">SVG</option></select></label><label class="field">PNG 倍率<select id="export-scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option></select></label><label class="field">输出范围<select id="export-range"><option value="full">完整图稿</option><option value="current">当前视野</option></select></label><div id="export-reference-options"><label class="check"><input id="export-references" type="checkbox">高度参考线</label><label class="check"><input id="export-arrows" type="checkbox">楼梯方向箭头</label></div><p id="export-ready" role="status">正在生成预览…</p><button id="export-download" data-action="export-download" class="primary" disabled>导出文件</button><button data-action="export-close">取消</button></aside></div></dialog><input id="file-input" type="file" accept=".json,application/json" hidden><script id="editor-seed" type="application/json">SEED_JSON</script><script>/*EDITOR_JS*/</script></body></html>
